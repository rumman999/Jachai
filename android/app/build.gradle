plugins {
    id 'com.android.application'
}

// The backend URL is baked in at build time from local.properties:  api.baseUrl=https://your-app.up.railway.app/
// It can also be changed at runtime from the app's home screen (handy while testing on LAN).
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def apiBaseUrl = localProps.getProperty('api.baseUrl', 'https://YOUR-BACKEND.up.railway.app/')

// Release signing key (android/keystore.properties + .jks, both gitignored). Without it, release falls back to the
// debug key: fine on one machine, but APKs from different machines then can't update each other.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.jachai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jachai.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.4.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
